# DUPLO brick colour palette. One source for perception (colour names), the sim twin (brick
# colours) and the training data (random brick colours).
#
# Fields of each colour
#   lego:      the LEGO colour name.
#   albedo:    sim surface colour [r, g, b], 0..1. Under the sim lights an albedo renders about
#              1.08 times darker (floor check, 2026-11-14).
#   observed:  colours of real bricks in the station D415 images [r, g, b], 0..1, under the
#              station lights. Perception matches these first. Empty = not seen yet; then
#              perception uses albedo / 1.08.
#   seen:      true if a brick of this colour was seen at the station.
#   main:      true for the 12 main colours.
#
# Add a colour: give a new name with lego and albedo. Add observed samples when you see it.

gain: 1.08  # observed camera colour x gain = sim albedo

colors:
  # ---- 12 main colours ----
  red:      {lego: Bright Red,          albedo: [0.79, 0.10, 0.04], observed: [[0.702, 0.165, 0.155]], seen: true,  main: true}
  blue:     {lego: Bright Blue,         albedo: [0.00, 0.33, 0.75], observed: [], seen: false, main: true}
  azure:    {lego: Medium Azure,        albedo: [0.21, 0.68, 0.75], observed: [[0.141, 0.667, 0.749], [0.118, 0.384, 0.474]], seen: true,  main: true}  # fixture-002 brick in pink plate; fixture-001 brick in shade next to the arm
  yellow:   {lego: Bright Yellow,       albedo: [0.95, 0.80, 0.22], observed: [[0.753, 0.569, 0.204]], seen: true,  main: true}
  green:    {lego: Bright Green,        albedo: [0.29, 0.62, 0.29], observed: [], seen: false, main: true}
  orange:   {lego: Bright Orange,       albedo: [1.00, 0.54, 0.09], observed: [], seen: false, main: true}
  white:    {lego: White,               albedo: [0.95, 0.95, 0.93], observed: [[0.455, 0.573, 0.502]], seen: true,  main: true}  # fixture-002 off-white 2x4 in the green plate (green tint)
  black:    {lego: Black,               albedo: [0.05, 0.06, 0.07], observed: [], seen: false, main: true}
  brown:    {lego: Reddish Brown,       albedo: [0.35, 0.16, 0.07], observed: [], seen: true,  main: true}
  grey:     {lego: Light Bluish Gray,   albedo: [0.63, 0.65, 0.66], observed: [], seen: false, main: true}
  purple:   {lego: Medium Lavender,     albedo: [0.67, 0.47, 0.73], observed: [], seen: false, main: true}
  pink:     {lego: Bright Pink,         albedo: [0.89, 0.68, 0.78], observed: [], seen: false, main: true}
  # ---- more colours ----
  lime:        {lego: Lime,              albedo: [0.73, 0.91, 0.04], observed: [], seen: false, main: false}
  tan:         {lego: Tan,               albedo: [0.89, 0.80, 0.62], observed: [], seen: true,  main: false}
  dark_green:  {lego: Dark Green,        albedo: [0.09, 0.27, 0.20], observed: [], seen: false, main: false}
  dark_azure:  {lego: Dark Azure,        albedo: [0.03, 0.55, 0.79], observed: [], seen: false, main: false}
  magenta:     {lego: Magenta,           albedo: [0.57, 0.22, 0.47], observed: [], seen: false, main: false}
  light_yellow: {lego: Bright Light Yellow, albedo: [1.00, 0.94, 0.23], observed: [], seen: false, main: false}
