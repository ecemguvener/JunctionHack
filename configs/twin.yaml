# Station twin config: real D415 cameras + arm joints -> MuJoCo scene.
# Camera poses and intrinsics are NOT here: they are in configs/sim-scene.yaml (one source).
# Frames and units: see src/brickcell/twin/state.py. Lengths in metres.
# Each section has one owner module. Edit only your own section.

# --- station: owner src/brickcell/twin/station.py (Intel laptop, owns the D415s) ---
station:
  port: 8095                # HTTP port; the service binds 127.0.0.1 only (use an SSH tunnel)
  frames: 10                # frames per snapshot and camera; depth = per-pixel median of valid
  warmup: 45                # frames to drop after a camera opens (auto exposure)
  serials: {overhead: "350122060653", side: "243622060450"}  # name in sim-scene.yaml -> serial
  live_hz: 0.5              # default rate of POST /live (maximum 2)
  record_dir: ~/twin-fixtures   # POST /record writes <record_dir>/fixture-NNN
  intrinsics_tolerance_px: 0.5  # warn if the SDK intrinsics differ from sim-scene.yaml
  depth_range_m: [0.15, 1.5]    # colour scale of /depth/<camera>.png
  arm_source: none          # none, file, armd, servo (live arm reads need user approval)
  gripper_closed_rad: 0.0   # MuJoCo gripper angle at 0 % (closed). Assumption, not measured
  gripper_open_rad: 1.7453292   # MuJoCo gripper angle at 100 % (open). Assumption

# --- perception: owner src/brickcell/twin/perception.py ---
# Only the keys you change are necessary; the other keys use the defaults in
# perception.DEFAULT_CONFIG (load_perception_config merges them).
perception:
  workspace: {min: [-0.10, -0.65, -0.04], max: [0.85, 0.60, 0.25]}  # world box (m)
  cameras:
    reference: overhead     # the other cameras are checked against this one
    max_disagreement: 0.02  # m; a camera whose plate centres differ more is not fused
    exclude: []             # camera names that are never used
  table:
    correct: true           # move each camera pose so that its table plane is z = 0
    max_tilt_deg: 5.0       # do not correct more tilt or offset than this
    max_offset: 0.03
  plates:
    floor_z: 0.0031         # a brick on a plate stands at this height (sim collision floor)
    # One or more colours per plate name; the nearest wins. First the real KALAS plates
    # (fixture-001, 2026-11-14), then the sim colours. Other colours = no name.
    colors:
      good: ["#17825c", [0.62, 0.86, 0.76]]
      defective: ["#c28fa1", [0.90, 0.72, 0.78]]
      spare: ["#0296bf", "#0ab0d4"]   # blue plate (not a sort target)
    max_color_distance: 20.0
    min_arc_deg: 160.0      # degrees of plate wall that must be seen
  segment:
    min_height: 0.005       # m above the table
    min_height_plate: 0.006 # m above a plate floor
    floor_color_tol: 14.0   # in a plate, points with the floor colour are floor
    color_split: 18.0       # colour change that splits two touching bricks
  fit:
    max_points: 300         # ICP points per segment
    min_score: 0.4          # explained x coverage
    min_silhouette_iou: 0.2
    silhouette_weight: 0.5  # 0 = do not use the colour outline to rank hypotheses
    free_refine: false      # 6-DoF refinement for poses that are not stable (not tuned)
  cache_dir: ~/.cache/brickcell/twin-perception  # closest-point grids of the meshes

# --- sim: owner src/brickcell/twin/sim_sync.py and the sim server ---
# The sim server copies the station: POST /twin/sync, POST /twin/live, "Station twin" panel.
sim:
  station_url: http://127.0.0.1:8095  # station service; the sim reads GET {station_url}/state
  fetch_timeout_s: 3.0
  fresh_timeout_s: 15.0   # for GET /state?fresh=1 (new frames)
  live_hz: 1.0            # live polling rate; at most 2
  # Never-overlap guard, before any physics: move overlapping bricks apart in x, y (smallest
  # total move; orientation and height stay) until each brick is min_clearance_m from each
  # other brick and each plate wall. Then contact and friction between bricks cannot move them.
  separate: true
  min_clearance_m: 0.0005
  max_separation_mm: 10.0 # a larger move of a brick by the guard = flag
  relax_s: 0.2            # zero-velocity steps: remove table / plate floor penetration, close gaps up to ~4 mm
  settle_s: 0.5           # normal physics after the relax, arm held
  max_drift_mm: 3.0       # settled pose farther from the separated pose = flag in the report
  max_drift_deg: 5.0
  max_penetration_mm: 5.0 # deeper penetration of the table or a plate floor = flag
  # Brick colours: palette (albedo of the palette colour: BrickState.color_name, else the
  # nearest to the observed colour; configs/brick-palette.yaml), observed (observed x
  # color_gain), off.
  color_mode: palette
  # Bricks that are not in the state go to a park spot (x, y on the table). No camera sees the
  # spots. Default: a 4 x 4 grid for all 16 brick bodies (world.PARK; part-001 at
  # [-1.05, 0.90]). Give only the entries to change, e.g. park: {part-001-2: [-1.65, 0.90]}.
  park: {}
  # Plates that go to their park spot (park_plates, default world.PARK_PLATES) when the state
  # does not have them. The other plates keep their place.
  park_absent_plates: [spare]

# --- calibration: owner src/brickcell/twin/calibrate.py ---
calibration:
  max_range_m: 1.3              # depth points farther than this are not used
  table_threshold_m: 0.004      # RANSAC inlier distance for the table plane
  board_band_m: [-0.002, 0.007] # board pixels are this far above the table plane
  overhead_pivot_xy: [0.0, 0.0] # the overhead levelling keeps x, y of this world point
  object_z_m: [0.006, 0.12]     # plates and bricks for the side registration (world z)
  object_box_m: [[0.0, 0.6], [-0.45, 0.25]]  # world x range, y range of those points
  voxel_m: 0.002
  # Board pattern polygon (pixels, inside the grey tape) per camera. Measured 2026-11-14.
  # Change it if a camera moves. The table fit does not use this region.
  board_roi:
    overhead: [[147, 201], [255, 150], [358, 279], [244, 357]]
    side: [[183, 173], [472, 192], [517, 20], [316, 18]]
