[project]
name = "brickcell-dynamics"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco[sysid]==4.0.0",
  "frax==0.2.0",
  "jax==0.12.0.1",
  "jaxlib==0.12.0.1",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "trimesh>=4.7,<5",
  "pytest>=9,<10",
  "ruff>=0.17,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
