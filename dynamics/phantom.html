<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<div id="phantom">
<div class="toolbar"><button id="play">Pause</button><label>Time <input id="time" type="range" min="0" value="0" step="1"></label><output id="clock"></output><label>Phantom <select id="iteration"></select></label></div>
<div class="toolbar"><span class="measured">● Measured encoders</span><span class="predicted">● Simulated phantom</span><label><input type="checkbox" id="showMeasured" checked> Measured</label><label><input type="checkbox" id="showPhantom" checked> Phantom</label><button id="side">Side view</button><button id="perspective">3D view</button></div>
<div id="stage" role="img" aria-label="Recorded arm and independently simulated phantom. Drag to orbit, scroll to zoom."></div>
<div id="metrics"></div><div id="gains"></div><div id="limits"></div>
<details><summary id="massSummary">Mass and full inertia inputs</summary><table><thead><tr><th>Rigid group</th><th>Mass</th><th>Source</th></tr></thead><tbody id="masses"></tbody></table><div id="inertias"></div></details>
<div id="error" role="alert"></div></div>
<style>
#phantom{font-family:var(--font-sans);color:var(--foreground);display:grid;gap:12px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.toolbar label{display:flex;gap:6px;align-items:center}#stage{height:420px;min-width:0;touch-action:none}#stage canvas{max-width:100%;display:block}#time{width:180px}.measured{color:var(--chart-1)}.predicted{color:var(--chart-2)}#limits{color:var(--muted-foreground);font-size:13px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:5px;border-bottom:1px solid var(--border)}#error{color:var(--destructive)}@media(max-width:480px){#stage{height:340px}#time{width:130px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{const payload=/*PAYLOAD*/;const root=document.getElementById('phantom');try{
const stage=root.querySelector('#stage'), slider=root.querySelector('#time'), select=root.querySelector('#iteration');
function color(v){const d=document.createElement('span');d.style.color=`var(${v})`;root.append(d);const s=getComputedStyle(d).color;d.remove();return new THREE.Color(s)}
const cMeasured=color('--chart-1'),cPhantom=color('--chart-2'),border=color('--border');
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.001,10);camera.up.set(0,0,1);scene.add(new THREE.HemisphereLight(0xffffff,0x777777,1.3));const light=new THREE.DirectionalLight(0xffffff,.8);light.position.set(.5,-.3,1);scene.add(light);
const control=new THREE.OrbitControls(camera,renderer.domElement);control.minDistance=.1;control.maxDistance=2;
function create(c,opacity){const group=new THREE.Group(),nodes=[],homes=[];scene.add(group);payload.geometry.forEach((row,i)=>{const n=new THREE.Group();n.matrixAutoUpdate=false;nodes.push(n);homes.push(new THREE.Matrix4().set(...row.h));(row.parent<0?group:nodes[row.parent]).add(n);row.meshes.forEach(mesh=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(mesh.v.map(x=>x*1e-5),3));g.setIndex(mesh.f);g.computeVertexNormals();n.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,transparent:opacity<1,opacity,depthWrite:opacity===1,roughness:.7,side:THREE.DoubleSide})))})});return {group,nodes,homes}}
const measured=create(cMeasured,.85),phantom=create(cPhantom,.36);
function pose(tree,q){payload.geometry.forEach((row,i)=>{const j=payload.jointNames.indexOf(row.joint);const angle=j<0?0:payload.offsets[j]+payload.signs[j]*q[j];const r=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(...row.axis),angle);tree.nodes[i].matrix.copy(tree.homes[i]).multiply(r)});scene.updateMatrixWorld(true)}
payload.candidates.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.label;select.append(o)});select.value=payload.candidates.length-1;
slider.max=payload.t.length-1;
let playing=true,index=0,last=0;
function draw(){index=+slider.value;const candidate=payload.candidates[+select.value];pose(measured,payload.observed[index]);pose(phantom,candidate.q[index]);measured.group.visible=root.querySelector('#showMeasured').checked;phantom.group.visible=root.querySelector('#showPhantom').checked;root.querySelector('#clock').textContent=payload.t[index].toFixed(2)+' s';const e=payload.observed[index].map((x,j)=>(candidate.q[index][j]-x)*180/Math.PI);root.querySelector('#metrics').textContent=`${payload.partition} · ${payload.synthetic?'SYNTHETIC':'REAL encoder recording'} · phantom RMSE ${candidate.rmse.toFixed(3)}° · current joint errors ${e.map(x=>x.toFixed(2)+'°').join(' / ')}`;const p=candidate.parameters;root.querySelector('#gains').textContent=`Effective gains · P [${p.kp.map(x=>x.toFixed(2)).join(', ')}] · I [${p.ki.map(x=>x.toFixed(2)).join(', ')}] · D [${p.kd.map(x=>x.toFixed(3)).join(', ')}]`;renderer.render(scene,camera)}
pose(measured,payload.observed[0]);pose(phantom,payload.candidates[0].q[0]);
const box=new THREE.Box3().setFromObject(measured.group),center=box.getCenter(new THREE.Vector3());const grid=new THREE.GridHelper(.7,14,border,border);grid.rotation.x=Math.PI/2;grid.position.z=box.min.z-.005;scene.add(grid);control.target.copy(center);
function view(side){camera.position.copy(center).add(side?new THREE.Vector3(-.65,.02,.10):new THREE.Vector3(-.5,.45,.3));control.update();draw()}
root.querySelector('#side').onclick=()=>view(true);root.querySelector('#perspective').onclick=()=>view(false);slider.oninput=draw;select.onchange=draw;control.addEventListener('change',draw);root.querySelectorAll('input[type=checkbox]').forEach(e=>e.onchange=draw);
root.querySelector('#play').onclick=()=>{playing=!playing;root.querySelector('#play').textContent=playing?'Pause':'Play';last=0};
function tick(now){if(playing){if(!last)last=now;if(now-last>40){slider.value=(+slider.value+1)%payload.t.length;last=now;draw()}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
new ResizeObserver(()=>{camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight);draw()}).observe(stage);
root.querySelector('#limits').textContent=payload.massStatus+'. Optimizer changes effective actuator response; SI gains are not firmware register values. The measured mesh uses recorded encoder FK. Contact tuning is outside this fit.';
const groups=Object.entries(payload.masses).filter(([,r])=>r.mass_kg>0);root.querySelector('#massSummary').textContent=`Mass and full inertia inputs · ${(groups.reduce((sum,[,r])=>sum+r.mass_kg,0)*1000).toFixed(1)} g total including base`;
groups.forEach(([name,r])=>{const label=r.source_link||name;const provenance=r.measured?'Measured input':r.source_link?'Published Robot Studio CAD':'UNMEASURED prior';const tr=document.createElement('tr');[label,(r.mass_kg*1000).toFixed(3)+' g',provenance].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});root.querySelector('#masses').append(tr);const detail=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent=label+' · COM and tensor in calibrated local frame';pre.textContent='COM [m]: '+r.com_m.map(x=>x.toFixed(6)).join(', ')+'\nInertia [kg m²]:\n'+(r.inertia_matrix_kg_m2||r.diagonal_inertia_kg_m2.map((v,i)=>[0,1,2].map(j=>i===j?v:0))).map(row=>row.map(x=>x.toExponential(6)).join('  ')).join('\n');detail.append(summary,pre);root.querySelector('#inertias').append(detail)});
view(false);window.phantomTest={frames:payload.t.length,candidates:payload.candidates.length,setFrame:(i)=>{slider.value=i;draw()},positions:()=>measured.nodes.map(n=>new THREE.Vector3().setFromMatrixPosition(n.matrixWorld).toArray())};
const a=window.phantomTest.positions();window.phantomTest.setFrame(Math.floor(payload.t.length*.3));const b=window.phantomTest.positions();if(!a.some((p,i)=>Math.hypot(...p.map((x,j)=>x-b[i][j]))>1e-5))throw Error('Recorded playback did not update arm geometry');console.info('Phantom playback geometry check passed');
}catch(e){root.querySelector('#error').textContent=e.message;console.error(e)}})();
</script></body></html>
