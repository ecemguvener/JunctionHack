[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "brickcell"
version = "0.1.0"
description = "CPU visual inspection and simulated robot supervision for Junction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anomalib==2.7.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "openvino>=2026.0,<2027",
  "onnx>=1.17", "onnxscript>=0.5",
  "numpy>=2.0,<3", "pillow>=10.1", "opencv-python-headless>=4.10",
  "pyyaml>=6", "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
brickcell = "brickcell.cli:main"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["model: real trained model tests (set BRICKCELL_MODEL_CONFIG)", "simulation: live MuJoCo camera and contact-physics integration (set BRICKCELL_SIMULATION_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/configs", "/docs", "/scripts",
  "/policy/*.py", "/policy/pyproject.toml", "/policy/uv.lock",
  "/README.md", "/AGENTS.md", "/Makefile", "/pyproject.toml",
  "/uv.lock", "/.python-version", "/.gitignore",
]
