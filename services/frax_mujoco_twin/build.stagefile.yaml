version: 1
stages:
  - name: frax-mujoco-twin
    from: python:3.12-slim
    workdir: /app
    install:
      apt:
        packages: [libegl1, libgl1, libgles2, libglvnd0, libosmesa6]
      pip:
        - packages:
            - mujoco==4.0.1
            - frax[ik]==0.2.0
            - babyros==0.1.10
    copy:
      - from: local
        paths: [twin_server.py]
    cmd: [python3, -u, /app/twin_server.py]
