version: 1
stages:
  - name: armd-bridge
    from: python:3.12-slim
    workdir: /app
    install:
      pip:
        - packages:
            - babyros==0.1.10
            - websockets>=14.0
            - numpy>=2.0,<3
    copy:
      - from: local
        paths: [armd_bridge_node.py]
    cmd: [python3, -u, /app/armd_bridge_node.py]
