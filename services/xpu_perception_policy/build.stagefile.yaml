version: 1
stages:
  - name: xpu-perception-policy
    from: python:3.12-slim
    workdir: /app
    install:
      pip:
        - packages:
            - openvino==2026.4.1
            - babyros==0.1.10
            - scikit-learn>=1.5
            - scipy>=1.14
            - opencv-python-headless>=4.10
    copy:
      - from: local
        paths: [perception_policy_node.py]
    cmd: [python3, -u, /app/perception_policy_node.py]
