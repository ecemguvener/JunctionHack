version: 1
stages:
  - name: camera-pub
    from: python:3.12-slim
    workdir: /app
    install:
      apt:
        packages: [libusb-1.0-0, libgl1, libglib2.0-0]
      pip:
        - packages:
            - pyrealsense2>=2.55
            - opencv-python-headless>=4.10
            - babyros==0.1.10
            - numpy>=2.0,<3
    copy:
      - from: local
        paths: [camera_pub.py]
    cmd: [python3, -u, /app/camera_pub.py]
